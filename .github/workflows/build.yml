name: Build firmware
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.4
          arduino-cli lib install U8g2 ChronosESP32 ESP32Time NimBLE-Arduino

      - name: Compile (ESP32-C3, USB CDC on, Huge APP)
        run: |
          mkdir -p sketch/esp32c3_phone_map
          cp esp32c3_phone_map.ino sketch/esp32c3_phone_map/
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=huge_app \
            --export-binaries --output-dir out \
            sketch/esp32c3_phone_map
          cp out/*.merged.bin firmware_flash_at_0x0.bin
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware_flash_at_0x0.bin
